{% extends "base.html" %}
{% block title %}Page not found - LegalLens{% endblock %}
{% block content %}
<section class="not-found" aria-labelledby="not-found-title">
  <h1 id="not-found-title">This page isn't here</h1>
  <p class="section-intro">The address may be mistyped, or the page has moved. You can scan your policy from the homepage.</p>
  <p class="not-found-actions">
    <a class="button button-primary" href="{{ url_for('index') }}#scan">Scan your policy</a>
    <a class="button" href="{{ url_for('index') }}">Go to the homepage</a>
  </p>
</section>
{% endblock %}
